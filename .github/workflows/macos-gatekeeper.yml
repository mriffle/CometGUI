# CometGUI -- macOS Gatekeeper verification, PHASE-05 exit gate item 9.
#
# WHY THIS FILE EXISTS.  "On macOS, a freshly installed managed tool executes
# without a Gatekeeper refusal" is the one item of Phase 05's exit gate that no
# machine in this project can answer.  No macOS binary has ever been executed
# anywhere in this repository.  R-PLAT-04 requires com.apple.quarantine to be
# cleared from everything the tool cache will execute, and
# org.cometgui.install.cache.PlatformFixups does that through Java's
# UserDefinedFileAttributeView -- exercised on Linux against an attribute NAMED
# com.apple.quarantine, which is tier A under STATUS.rst's two-tier rule and is
# explicitly NOT a claim that Gatekeeper then accepts the binary.  Whether that
# Java view can even see the real attribute on macOS, which keeps extended
# attributes in its own namespace, is unknown.  This workflow is the only thing
# in the repository that can find out.
#
# WHAT THIS FILE HAS BEEN SEEN TO DO: NOTHING.  As of 2026-09-18 it has never
# run.  It was authored on a Linux machine, its driver's --self-test and
# --check-only modes were run there, and no line of it has executed on a Mac.
# Nothing in this repository may be read as a statement about macOS until a
# runner has returned a transcript, and this comment is where that transcript
# gets recorded when it does -- the way windows-percolator.yml records run
# 33644055780.
#
# THE NEGATIVE CONTROL IS THE WHOLE JOB.  A `curl` download sets no
# com.apple.quarantine: LaunchServices sets it, and a CI runner fetching bytes
# with a command-line tool produces an unquarantined file.  So a job that
# downloaded a binary and ran it would be exactly as green on a machine where
# the product's fix-up did nothing at all.  The driver therefore sets the
# attribute itself, proves it is set by reading it back with /usr/bin/xattr AND
# with the product's own Java view, RUNS THE BINARY WHILE IT IS STILL SET, and
# records what happens -- and only then runs PlatformFixups and tries again.
# If that control does not bite, the driver exits 2 and the verdict says THIS
# CHECK CANNOT GO RED ON THIS MACHINE.  It is never reported as a pass.  A
# hosted runner is not a clean end-user Mac: no GUI login session, no Finder,
# different SIP and policy state.  If that is what this job finds, that finding
# is worth more than a green tick.
#
# WHICH BINARY, AND WHY.  macos-latest is Apple silicon, and Comet 2026.02.2
# publishes a native aarch64 macOS build (comet.aarch64.macos.exe in
# manifests/tools.json) -- so the artefact under test needs no Rosetta 2, and
# the Gatekeeper question is not entangled with the translation question.  The
# macOS Percolator is x86-64 only (D-004) and would need Rosetta 2, which a
# hosted arm64 runner may not have; the gate item is deliberately not made to
# depend on it.  Whether Rosetta 2 is present is REPORTED by the driver, in its
# own clearly labelled section, and gates nothing.
#
# THE JOB MUST BE ABLE TO FAIL, AND SAY WHY.  The driver exits 1 for a negative
# finding about R-PLAT-04, 2 for an inconclusive run (the "cannot go red"
# branch among them), 3 for a harness failure, 4 if this is not a Mac at all,
# and every assertion in the transcript names the value it observed rather than
# relying on an exit code.  `if: always()` on the upload is why a FAILING run
# still returns its evidence, which is precisely the case a negative result
# needs; the driver also prints the transcript to stdout, so the job log
# carries it whether the upload runs or not.
#
# HOW IT IS TRIGGERED.  `pull_request` is the trigger that matters: opening the
# branch that carries this file as a pull request against main is what runs it
# the first time.  `workflow_dispatch` is declared too, but GitHub only offers
# the "Run workflow" button for a workflow file already on the default branch,
# so until this merges the pull request is the only way to start it.
#
# ONE STEP, ONE SCRIPT.  Every `run:` is a single `bash scripts/...` invocation
# a person can run on their own machine; scripts/ci/check-workflows.py checks
# this file the same way it checks the other four, discovering it rather than
# being told about it, and its REQUIRED_CONTENT entry is what stops this
# workflow being left in place while quietly proving nothing.  There is no
# setup-java action and no setup-python: the driver finds a JDK by RUNNING each
# candidate, and nothing is installed.

name: macos-gatekeeper

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    # macos-latest, and there is no matrix: the point of this job is the one
    # platform this project has never been able to observe.  The timeout is
    # generous for a 4 MB download, a javac compilation of the product closure
    # and two runs of `comet -p`; the driver imposes its own per-process
    # timeout, so a binary that hangs is recorded as a timeout rather than left
    # for the runner to kill.
    name: Gatekeeper and com.apple.quarantine on macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # Pinned to the commit actions/checkout v5 resolved to on 2026-08-29 --
      # the same commit the other four workflows pin.  A tag is mutable, and an
      # action runs arbitrary code inside the job.
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Quarantine, refusal, the product's fix-up, and the run after it
        run: bash scripts/ci/macos-gatekeeper-verify.sh

      # actions/upload-artifact v7.0.1, pinned to the commit that tag resolved
      # to on 2026-08-30.  `if: always()` is deliberate and is checked: without
      # it a failing verification is the one case whose transcript never leaves
      # the runner.  if-no-files-found: error, because an empty artifact would
      # look like a clean run to anyone reading the run summary later.
      - name: Upload the transcript, whether the check passed or failed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: macos-gatekeeper-transcript
          path: _build/macos-gatekeeper/
          if-no-files-found: error
