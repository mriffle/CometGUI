# CometGUI -- nightly pipeline.
#
# The specification's list, in "CI and Release Pipeline / Nightly pipeline":
# the broader Comet and Percolator version matrix; a larger real dataset;
# determinism comparisons; performance metrics; the headless and native GUI
# test suites; the Windows RAW search test; a documentation link check; and
# verification that every managed tool URL and checksum in the manifest is
# still reachable and unchanged (R-TEST-08).
#
# MOST OF IT IS A STUB TODAY, AND EVERY STUB EXITS 70, NOT 0.
# PHASE-01's job is to install the pipeline before the work it drives exists;
# the phase document permits nightly steps to be stubs "that fail loudly rather
# than silently passing".  scripts/ci/stub-lib.sh is what makes that literal:
# each stub prints which phase owns the real check and exits non-zero.  A green
# stub would mean nothing; a red one names exactly what is missing.
#
# ONE JOB PER CHECK, AND THAT IS THE FIX FOR A REAL DEFECT.  Until 2026-10-01
# every Linux step ran in one job, in order, and GitHub aborts a job at its
# first failing step -- so the first stub (step 6) skipped the documentation
# link check (step 11), the one real check here, every night from 2026-08-31.
# A check that is never reached is as inert as one that can never go red
# (STATUS.rst, status-nightly-masking).  Jobs run independently, so a stub can
# no longer hide anything: the "real checks" job is graded on its own, and each
# stub is its own red line naming its owner.  The run as a whole stays red
# until Phase 15 replaces the stubs; that is the honest state, and nothing may
# be added to mark a step as allowed to fail, or to swallow its exit status
# (scripts/ci/check-workflows.sh refuses both).  Phase 15 replaces them one
# at a time: the tool manifest verification (R-TEST-08) is real since unit 5,
# the version matrix since unit 6, determinism since unit 7 and performance
# since unit 8 (the fixture half of each waits on D-006; performance is also
# red on every runner with no recorded profile, which is every GitHub-hosted
# runner until a dedicated one exists).
#
# scripts/ci/run-pipeline-locally.sh runs every step below on this machine and
# requires each stub to fail and each real step to pass.

name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  linux:
    # The real checks: provisioning, then the documentation link check.
    name: "Nightly (Linux): real checks"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Project-local JDK and Maven (no setup-java)
        run: bash scripts/ci/toolchain.sh

      - name: Project-local font stack for the headless JavaFX tests
        run: bash scripts/ci/fontstack.sh

      - name: Project virtualenv for the documentation toolchain
        run: bash scripts/ci/python-env.sh

      - name: Documentation link check
        run: bash scripts/ci/nightly-linkcheck.sh

  version-matrix:
    # PHASE-15 gate item 1, real since Phase 15 unit 6: the version matrix's
    # spectra-free half.  Every build the product offers on this runner is
    # installed from its pinned upstream URL into an empty cache by the
    # product's own Tool Manager and probes, then exercised (Comet -p/-q against
    # the committed fixtures, Percolator over CometGUI's own synthetic PIN
    # against reviewed goldens); every other combination the manifest names is
    # recorded as UNAVAILABLE or UNVERIFIED by name.  Needs the project JDK and
    # Maven; no spectra.  The pair runs are the large-dataset job's.
    name: "Nightly (Linux): version matrix (gate item 1, no spectra)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Project-local JDK and Maven (no setup-java)
        run: bash scripts/ci/toolchain.sh

      - name: Broader Comet and Percolator version matrix
        run: bash scripts/ci/nightly-version-matrix.sh

  large-dataset:
    # The version matrix's fixture half: every (Comet, Percolator) pair run over
    # a real dataset against version-keyed goldens.  It takes its fixture as ONE
    # named input, COMETGUI_MATRIX_FIXTURE, and none exists on a runner: D-006's
    # CI fixture is OPEN, so the step exits 70 through stub-lib.sh, naming what
    # it waits for and what it would need -- red, in its own job, never green.
    name: "Nightly (Linux): large dataset (waits on D-006's CI fixture)"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Larger real dataset regression
        run: bash scripts/ci/nightly-large-dataset.sh

  determinism:
    # PHASE-15 gate item 3, real since Phase 15 unit 7: the determinism suite's
    # spectra-free half.  Every Percolator the product offers on this runner,
    # installed from its pinned upstream URL by the product's Tool Manager, run
    # over CometGUI's own synthetic PIN through the product's command builder:
    # repeated with the same seed, varied in thread count, and -- the control --
    # given another seed; every artefact compared with the tolerance written in
    # scripts/matrix/determinism-data.json and docs/developer/testing.rst.
    # Needs the project JDK and Maven; no spectra.  The Comet -> Percolator half
    # is the determinism-fixture job's.
    name: "Nightly (Linux): determinism (gate item 3, no spectra)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Project-local JDK and Maven (no setup-java)
        run: bash scripts/ci/toolchain.sh

      - name: Determinism comparisons
        run: bash scripts/ci/nightly-determinism.sh

  determinism-fixture:
    # The determinism suite's fixture half: the whole Comet -> Percolator run
    # repeated over a real dataset for every offered pair.  It takes the version
    # matrix's one named input, COMETGUI_MATRIX_FIXTURE, and none exists on a
    # runner: D-006's CI fixture is OPEN, so the step exits 70 through
    # stub-lib.sh, naming what it waits for -- red, in its own job, never green.
    name: "Nightly (Linux): determinism over a dataset (waits on D-006's CI fixture)"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Determinism comparisons over a real dataset
        run: bash scripts/ci/nightly-determinism-fixture.sh

  performance:
    # PHASE-15 gate item 4, real since Phase 15 unit 8: the performance suite's
    # spectra-free half -- startup, a large parameter file, the large result
    # tables and the peak GUI heap (AC-RES-10), multi-gigabyte hashing,
    # Percolator over the synthetic PIN, Cancel on a stand-in tool and project
    # reopen -- each measured through the product, repeated, and graded against
    # the thresholds of THIS RUNNER'S PROFILE (scripts/perf/performance-data.json).
    # RED ON GITHUB-HOSTED RUNNERS, BY DESIGN: no profile is recorded for a
    # shared 2-4 core runner, so after measuring and reporting everything the
    # step exits 4, "no baseline for this runner profile" -- never a silent
    # pass on thresholds measured elsewhere.  It turns green on a dedicated
    # runner once that runner's profile is recorded (docs/developer/testing.rst,
    # "Performance").  Needs the project JDK, Maven and font stack; no spectra.
    name: "Nightly (Linux): performance (gate item 4; red until a dedicated runner's profile exists)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Project-local JDK and Maven (no setup-java)
        run: bash scripts/ci/toolchain.sh

      - name: Project-local font stack for the headless JavaFX tests
        run: bash scripts/ci/fontstack.sh

      - name: Performance metrics
        run: bash scripts/ci/nightly-performance.sh

  performance-fixture:
    # The performance suite's fixture part: Comet's (informational) and
    # Percolator's execution time over a real dataset and Cancel during a real
    # Comet search.  It takes the version matrix's one named input,
    # COMETGUI_MATRIX_FIXTURE, and none exists on a runner: D-006's CI fixture
    # is OPEN, so the step exits 70 through stub-lib.sh, naming what it waits
    # for -- red, in its own job, never green.
    name: "Nightly (Linux): performance over a dataset (waits on D-006's CI fixture)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Performance metrics over a real dataset
        run: bash scripts/ci/nightly-performance-fixture.sh

  gui-tests:
    name: "Nightly (Linux): GUI suites (stub, Phase 15)"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Headless and native GUI test suites
        run: bash scripts/ci/nightly-gui-tests.sh

  manifest-verify:
    # R-TEST-08, real since Phase 15 unit 5.  Downloads every artefact
    # manifests/tools.json pins (about 170 MB), checks size, SHA-256, MD5 and
    # each pinned archive member, and reads the GitHub releases listing of every
    # tool repository: red on a changed or vanished artefact or an unrecorded
    # newer release (exit 1), red when it could not verify (exit 3), never green
    # by default.  Standard-library Python only, so it needs no provisioning.
    name: "Nightly (Linux): tool manifest (R-TEST-08)"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Tool manifest verification (R-TEST-08)
        run: bash scripts/ci/nightly-manifest-verify.sh

  limelight-sandbox:
    # D-007's nightly Limelight-sandbox slot: provisioned for, and NOT
    # configured.  No sandbox has been named and naming one is the owner's, so
    # until then the step reports that, names why, and exits 70 through
    # stub-lib.sh -- red, in its own job, never a green step that uploaded
    # nothing.  Supplying a sandbox is configuration: set the repository
    # VARIABLES below (vars., which hold no secret) and the script runs the
    # upload test against it.  The submit key has no way in yet: a secrets.
    # reference is forbidden in every workflow (check-workflows.py, D-008), so
    # admitting one credential here is an owner decision.  No default URL exists.
    name: "Nightly (Linux): Limelight sandbox (D-007, not configured)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Limelight sandbox upload (D-007 slot)
        run: bash scripts/ci/nightly-limelight-sandbox.sh
        env:
          COMETGUI_LIMELIGHT_SANDBOX_URL: ${{ vars.COMETGUI_LIMELIGHT_SANDBOX_URL }}
          COMETGUI_LIMELIGHT_SANDBOX_PROJECT: ${{ vars.COMETGUI_LIMELIGHT_SANDBOX_PROJECT }}

  windows:
    # UNVERIFIABLE IN THIS ENVIRONMENT.  There is no non-Linux machine here and
    # This job has never run on a runner.  When
    # it first does, note that .gitattributes now pins *.sh to LF: without it
    # this step would have died on `set -Eeuo pipefail\r` before reaching the
    # stub.  It is named rather
    # than omitted because the specification requires the Windows Thermo RAW
    # search test in the nightly pipeline, and a later phase should switch it on
    # rather than discover it was never written.  PHASE-15 owns the RAW test.
    name: Nightly (Windows RAW search)
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Windows Thermo RAW search test
        run: bash scripts/ci/nightly-windows-raw.sh
