# CometGUI traceability map -- the AC- half of the report R-DOC-03 requires.
#
# WHAT THIS FILE IS
# -----------------
# R-DOC-03 lets the traceability report be generated "from source annotations or
# a checked-in mapping file". The R- half needs no map: R-DOC-01 already fixes
# ownership in each phase document's :Delivers: field, and the generator reads it
# from there. This file is the AC- half, which has no such home -- an acceptance
# criterion's evidence is a test name, a human sign-off, or a phase that has not
# run yet.
#
# WHAT THE GENERATOR DOES WITH IT
# -------------------------------
# scripts/traceability verifies every entry rather than believing it, and the
# documentation build fails on any of these:
#
#   * an R- rule with no owning phase, or with more than one
#   * an AC- with no evidence at all
#   * a "test" entry whose class or method is not in cometgui-*/src/test/java
#   * a "check" entry whose file is gone or no longer contains its marker
#   * a human-sign-off claim the specification does not mark |human|, or a
#     |human| criterion this file does not claim
#   * an identifier here that specification.rst does not define, or one it
#     defines that is missing here
#   * a "planned" entry naming a phase that does not exist, a phase whose
#     :Proves: field does not claim the criterion, or a phase the STATUS.rst
#     phase board already records as PASSED
#
# EVIDENCE KINDS
# --------------
#   kind = "test"     class = "org.cometgui...Test"   [method = "..."]
#   kind = "check"    command = "..."  file = "..."  contains = "..."
#   kind = "human"    reference = "..."  record = "<path that must exist>"
#   kind = "planned"  phase = "nn"
#
# A criterion may carry several entries. One with a "check" today and a
# "planned" for the phase that finishes the job is reported as "partial", which
# is the honest description of, for example, AC-DOC-01: the strict Sphinx build
# runs now, but Read the Docs cannot build anything until there is a remote
# (D-008).
#
# HONEST STATE OF THIS FILE, 2026-08-29 (Phase 01, unit 6)
# --------------------------------------------------------
# Phases 02-16 have not run, so almost every criterion is "planned". Exactly two
# criteria have an automated check in the tree today, and NO criterion is yet
# backed by a named JUnit test -- the four test classes that exist prove build
# identity and JavaFX availability, neither of which is an acceptance criterion.
# The "test" kind is therefore fully implemented and unit-tested but currently
# unused; the first real entry arrives with Phase 04.
#
# Phase 01 is also installing the JaCoCo coverage gate, the PIT mutation gate
# and the ArchUnit rules (unit 3). They were not in the tree when this file was
# written, so AC-TST-02, AC-TST-03 and AC-TST-04 are mapped "planned" against
# Phase 15 rather than to a pom.xml that does not yet configure them. Upgrade
# them to "check" entries once those gates exist -- that is a real improvement
# to make, not a defect to hide.
#
# Keep entries in specification order. Run `bash scripts/ci/traceability.sh`
# after editing.

[meta]
owner = "phase 01, unit 6 (R-DOC-03)"
generator = "scripts/traceability"
check = "bash scripts/ci/traceability.sh"

