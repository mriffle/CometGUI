# CometGUI -- ArchUnit configuration for the architecture test module.
#
# archRule.failOnEmptyShould is ArchUnit's own guard against the vacuous pass:
# with it on, a rule whose that() clause matches no class FAILS instead of
# passing quietly.  It defaults to true; it is written here explicitly because
# a rule set that silently stops matching is the single most likely way this
# module comes to prove nothing, and a default is easier to lose than a line.
#
# ClassImportCensusTest.aRuleThatMatchesNothingFails() proves the setting is
# actually in force.  Setting it to false is a weakening of a gate.
archRule.failOnEmptyShould=true
