# Phase 12, design decisions P12-11 and P12-16: register the extensions listed in
# META-INF/services/org.junit.jupiter.api.extension.Extension for every test in
# this module.  The one listed is org.cometgui.tools.limelight.fake.LoopbackGuard,
# which routes every HTTP(S) connection to a non-loopback host into a loopback
# sinkhole for the whole test JVM, so that no test can reach a real Limelight
# server.  Its copies in other modules carry this file with them.
junit.jupiter.extensions.autodetection.enabled=true
