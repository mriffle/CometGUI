# failure-paths.toml -- Phase 14 exit-gate item 4: "Every failure-path scenario
# in the specification has a passing test."
#
# One [[scenario]] per item of specification.rst, "Failure-path scenarios", in
# its words (inline literals and all) and in its order. scripts/e2e/
# check-failure-paths.sh parses that paragraph itself and refuses this file if
# the two lists differ in any way, so a scenario cannot be dropped, added or
# reworded here without the specification changing first.
#
# Each scenario has a status:
#   covered  -- at least one [[scenario.test]] exercises it, and every mapped
#               test must exist, run and pass.
#   partial  -- what exists is listed, and the scenario is NOT yet proved; the
#               checker fails on it unless --allow-partial is given, and the
#               note names who owns the rest.
#
# Each test is a fully-qualified id, class#method, with $ before a nested
# class (Outer$Inner#method). Its level is one of:
#   gui-e2e     the Tier A or Tier B end-to-end scenario (real tools, opt-in)
#   gui         a GUI test of the launched application (TestFX, headless)
#   integration the workflow engine or the Tool Manager port, real components
#   unit+real   one component against the real tool binaries
#   unit        one component, no tool binary
# and its run is "ordinary" (scripts/build.sh runs it) or "e2e" (it runs only
# under -Dcometgui.e2e=true, the end-to-end harness's opt-in).
#
# Defects named in notes as "8a-Dn" are the Phase 14 unit 8a report's; they are
# recorded for the orchestrator and asserted by no test either way.

[[scenario]]
number = 1
text = "download checksum mismatch"
status = "covered"
note = "One flipped byte at the pinned URL: rejected at DOWNLOADING with nothing executed (R-SEC-02), the cache empty, Install offered again."

  [[scenario.test]]
  id = "org.cometgui.app.gui.ToolManagerInstallUiTest#aCorruptedArtefactIsRejectedAndNothingIsExecuted"
  level = "gui"
  run = "ordinary"

  [[scenario.test]]
  id = "org.cometgui.install.manager.ManagedToolManagerInstallTest#aCorruptedArtefactIsRejectedAndNothingIsExecuted"
  level = "integration"
  run = "ordinary"

