text = "insufficient disk space where it can be simulated safely"
status = "covered"
note = "Simulated: the kernel refusing CometGUI's own writes mid-run. A child JVM prepares a two-file run, lowers its own RLIMIT_FSIZE to 15000 bytes with util-linux prlimit (proved from its /proc/self/limits) and runs it; the first write refused is the merged PIN (about 20600 bytes; each stand-in PIN is 10318, run.json, the event log and provenance.json stay under the limit). The run fails at merge-pin saying File too large, nothing after it starts, no merged PIN or temporary file is left, run.json and provenance.json parse whole and agree it failed. Separately, a stage log whose writes fail is warned about once and does not end the run. NOT simulated: ENOSPC itself (EFBIG differs in text, not in the product's code path), a device full for every process, a tool rather than CometGUI hitting the limit, and a free-space pre-check, which the product does not have. A disk filling during finalisation leaves a run recorded succeeded with no provenance.json (8b-D1), measured and not asserted."

  [[scenario.test]]
  id = "org.cometgui.workflow.steps.FileSizeLimitRunTest#aWriteRefusedForWantOfRoom"
  level = "integration"
  run = "ordinary"

  [[scenario.test]]
  id = "org.cometgui.tools.process.StageRecorderTest#oneWarningAndOnlyOne"
  level = "unit"
  run = "ordinary"

